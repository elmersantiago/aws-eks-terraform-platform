name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform fmt, validate, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Format check
        run: terraform fmt -check -recursive -diff

      - name: Validate bootstrap
        working-directory: bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate infra
        working-directory: infra
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - uses: terraform-linters/setup-tflint@v4

      - name: TFLint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --format compact

  security-scan:
    name: Checkov security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Checkov (Terraform + Helm)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform,helm
          download_external_modules: true
          output_format: cli,sarif
          output_file_path: console,results.sarif
          # Findings are published to the Security tab for review instead of failing the build,
          # because some come from intentional lab trade-offs documented in the README.
          soft_fail: true

      - name: Upload results to GitHub code scanning
        if: always()
        continue-on-error: true # code scanning needs a public repo or GitHub Advanced Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

  helm:
    name: Helm lint and render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint charts/web-app

      - name: Render manifests
        run: helm template web-app charts/web-app > rendered.yaml && cat rendered.yaml
